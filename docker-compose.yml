services:
  cassandra:
    image: cassandra:4.1
    container_name: ldlc-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=ldlc-analytics-cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  cassandra-init:
    image: cassandra:4.1
    container_name: ldlc-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./schemas/lot3_cassandra.cql:/lot3_cassandra.cql:ro
    command: >
      bash -c "echo 'Initialisation du keyspace et des tables Lot 3...' &&
      cqlsh cassandra 9042 -f /lot3_cassandra.cql &&
      echo 'Schema Lot 3 charge avec succes.'"

  neo4j:
    image: neo4j:5-community
    container_name: ldlc-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_heap_initial__size=256M
      - NEO4J_server_memory_heap_max__size=512M
      - NEO4J_server_memory_pagecache_size=256M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1;'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  neo4j-init:
    image: neo4j:5-community
    container_name: ldlc-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./schemas/lot4_neo4j.cypher:/lot4_neo4j.cypher:ro
    command: >
      bash -c "cypher-shell -a neo4j:7687 -u neo4j -p password123 -f /lot4_neo4j.cypher &&
      echo 'Schema Lot 4 charge avec succes.'"

  redis:
    image: redis:7-alpine
    container_name: ldlc-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cassandra_data:
  neo4j_data:
  redis_data: